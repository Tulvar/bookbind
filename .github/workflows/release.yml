name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to include in artifact names, for example v0.4.0"
        required: true
        default: "v0.4.0"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.goos }}-${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            extension: ""
          - goos: linux
            goarch: arm64
            extension: ""
          - goos: darwin
            goarch: amd64
            extension: ""
          - goos: darwin
            goarch: arm64
            extension: ""
          - goos: windows
            goarch: amd64
            extension: ".exe"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version="${{ inputs.version }}"
          else
            version="${GITHUB_REF_NAME}"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Build CLI
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        shell: bash
        run: |
          mkdir -p dist
          binary="bookbind-${{ steps.version.outputs.version }}-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.extension }}"
          go build \
            -ldflags "-s -w -X github.com/Tulvar/bookbind/pkg/version.Version=${{ steps.version.outputs.version }}" \
            -o "dist/${binary}" \
            ./cmd/bookbind

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: bookbind-${{ steps.version.outputs.version }}-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error

      - name: Upload release asset
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*

  desktop:
    name: Build desktop ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-amd64
            os: ubuntu-22.04
            platform: linux/amd64
          - target: darwin-amd64
            os: macos-15-intel
            platform: darwin/amd64
          - target: darwin-arm64
            os: macos-latest
            platform: darwin/arm64
          - target: windows-amd64
            os: windows-latest
            platform: windows/amd64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Wails Linux dependencies
        if: runner.os == 'Linux'
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update -o Acquire::Retries=3
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            libgtk-3-dev \
            libwebkit2gtk-4.0-dev \
            pkg-config

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: desktop/go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            desktop/go.sum

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop/frontend/package-lock.json

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version="${{ inputs.version }}"
          else
            version="${GITHUB_REF_NAME}"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.17.1

      - name: Build desktop app
        working-directory: desktop
        env:
          CGO_CFLAGS: ${{ runner.os == 'macOS' && '-mmacosx-version-min=13.0' || '' }}
          CGO_LDFLAGS: ${{ runner.os == 'macOS' && '-mmacosx-version-min=13.0' || '' }}
        run: wails build -platform ${{ matrix.platform }} -ldflags "-s -w -X github.com/Tulvar/bookbind/pkg/version.Version=${{ steps.version.outputs.version }} -X main.bundledFFmpeg=1"

      - name: Install NASM on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get install -y --no-install-recommends nasm

      - name: Install NASM on Intel macOS
        if: matrix.target == 'darwin-amd64'
        run: command -v nasm || brew install nasm

      - name: Set up the Windows FFmpeg toolchain
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: curl make xz mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-nasm

      - name: Bundle FFmpeg on Linux
        if: runner.os == 'Linux'
        run: bash desktop/build/bundle-ffmpeg.sh desktop/build/bin

      - name: Bundle FFmpeg on macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          app=desktop/build/bin/bookbind-desktop.app
          bash desktop/build/bundle-ffmpeg.sh "$app/Contents/Resources"
          codesign --force --sign - "$app/Contents/Resources/bin/ffmpeg"
          codesign --force --sign - "$app/Contents/Resources/bin/ffprobe"
          codesign --force --sign - "$app"
          codesign --verify --deep --strict "$app"

      - name: Bundle FFmpeg on Windows
        if: runner.os == 'Windows'
        shell: msys2 {0}
        env:
          FFMPEG_BUILD_JOBS: "4"
        run: bash -o igncr desktop/build/bundle-ffmpeg.sh desktop/build/bin

      - name: Package Linux desktop
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p dist
          tar -czf "dist/bookbind-desktop-${{ steps.version.outputs.version }}-${{ matrix.target }}.tar.gz" \
            -C desktop/build/bin \
            bookbind-desktop bin ffmpeg-source

      - name: Package macOS desktop
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent \
            desktop/build/bin/bookbind-desktop.app \
            "dist/bookbind-desktop-${{ steps.version.outputs.version }}-${{ matrix.target }}.zip"

      - name: Package Windows desktop
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive `
            -Path desktop/build/bin/bookbind-desktop.exe, desktop/build/bin/bin, desktop/build/bin/ffmpeg-source `
            -DestinationPath "dist/bookbind-desktop-${{ steps.version.outputs.version }}-${{ matrix.target }}.zip" `
            -Force

      - name: Upload desktop artifact
        uses: actions/upload-artifact@v4
        with:
          name: bookbind-desktop-${{ steps.version.outputs.version }}-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

      - name: Upload desktop release asset
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
