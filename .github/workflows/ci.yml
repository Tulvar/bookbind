name: CI

on:
  push:
    branches:
      - main
      - init
      - "release/**"
      - "feature/**"
      - "ci/**"
  pull_request:

jobs:
  test:
    name: Go test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        shell: bash
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "gofmt is needed for:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Build CLI
        run: go build ./cmd/bookbind

  desktop:
    name: Desktop smoke
    runs-on: [self-hosted, linux, x64]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Wails Linux dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          missing=()
          command -v gcc >/dev/null || missing+=(build-essential)
          command -v pkg-config >/dev/null || missing+=(pkg-config)
          pkg-config --exists gtk+-3.0 || missing+=(libgtk-3-dev)
          pkg-config --exists webkit2gtk-4.0 || missing+=(libwebkit2gtk-4.0-dev)
          if [ "${#missing[@]}" -eq 0 ]; then
            echo "Wails Linux dependencies already installed."
            exit 0
          fi
          sudo apt-get update -o Acquire::Retries=3
          sudo apt-get install -y --no-install-recommends \
            "${missing[@]}"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: desktop/go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            desktop/go.sum

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: desktop/frontend
        run: npm ci

      - name: Build frontend
        working-directory: desktop/frontend
        run: npm run build

      - name: Vet desktop
        working-directory: desktop
        run: go vet ./...

      - name: Test desktop
        working-directory: desktop
        run: go test ./...

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0

      - name: Build desktop app
        working-directory: desktop
        run: wails build
